<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="沱江吊脚楼水墨示意图">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0E7D2"/>
      <stop offset="1" stop-color="#F2EBD8"/>
    </linearGradient>
    <linearGradient id="mFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA98D" stop-opacity=".38"/>
      <stop offset="1" stop-color="#7FA98D" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="mMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E8A6A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4E8A6A" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA7A5" stop-opacity=".5"/>
      <stop offset="1" stop-color="#A8C2BC" stop-opacity=".35"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#sky)"/>

  <!-- 远山 -->
  <path d="M0,300 C150,210 260,258 380,222 C500,190 560,248 680,218 C800,192 880,246 1000,214 C1090,190 1150,232 1200,222 L1200,420 L0,420 Z" fill="url(#mFar)" filter="url(#soft)"/>
  <!-- 中景山 -->
  <path d="M0,360 C120,300 220,338 340,312 C470,284 540,336 660,308 C790,282 860,330 980,306 C1080,286 1160,322 1200,314 L1200,470 L0,470 Z" fill="url(#mMid)" filter="url(#soft2)"/>

  <!-- 雾带 -->
  <ellipse cx="420" cy="402" rx="330" ry="26" fill="#F2EBD8" opacity=".85" filter="url(#soft)"/>
  <ellipse cx="940" cy="416" rx="300" ry="22" fill="#F2EBD8" opacity=".8" filter="url(#soft)"/>

  <!-- 吊脚楼群（左岸） -->
  <g fill="#2E2A25">
    <!-- 楼1 -->
    <path d="M96,392 L146,384 L152,394 L120,398 L122,436 L104,438 Z" opacity=".9"/>
    <rect x="118" y="400" width="3.5" height="42" opacity=".75"/>
    <rect x="136" y="397" width="3.5" height="45" opacity=".75"/>
    <rect x="152" y="395" width="3.5" height="47" opacity=".75"/>
    <!-- 楼2 -->
    <path d="M168,388 L234,378 L242,390 L198,396 L200,442 L176,445 Z" opacity=".92"/>
    <rect x="194" y="402" width="3.5" height="46" opacity=".75"/>
    <rect x="212" y="400" width="3.5" height="48" opacity=".75"/>
    <rect x="230" y="397" width="3.5" height="50" opacity=".75"/>
    <rect x="246" y="394" width="3.5" height="52" opacity=".75"/>
    <!-- 楼3 -->
    <path d="M262,384 L320,375 L327,386 L290,391 L292,434 L271,437 Z" opacity=".88"/>
    <rect x="286" y="398" width="3.5" height="44" opacity=".75"/>
    <rect x="303" y="396" width="3.5" height="45" opacity=".75"/>
    <!-- 屋脊起翘 -->
    <path d="M96,392 Q92,388 88,390" stroke="#2E2A25" stroke-width="2" fill="none" opacity=".8"/>
    <path d="M320,375 Q326,370 331,373" stroke="#2E2A25" stroke-width="2" fill="none" opacity=".8"/>
  </g>

  <!-- 江面 -->
  <rect x="0" y="432" width="1200" height="243" fill="url(#river)"/>
  <path d="M0,436 C300,444 900,430 1200,440 L1200,448 C900,438 300,452 0,444 Z" fill="#F2EBD8" opacity=".55"/>
  <!-- 水纹 -->
  <g stroke="#4E8A6A" stroke-opacity=".35" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M120,500 h130"/><path d="M180,528 h190"/><path d="M420,486 h150"/>
    <path d="M700,520 h210"/><path d="M960,492 h140"/><path d="M520,560 h230"/>
    <path d="M240,596 h160"/><path d="M820,586 h180"/>
  </g>
  <!-- 倒影 -->
  <g fill="#2E2A25" opacity=".14">
    <path d="M190,448 L250,448 L246,470 L198,470 Z"/>
    <path d="M280,446 L330,446 L326,462 L286,462 Z"/>
  </g>

  <!-- 渔舟 -->
  <g>
    <path d="M636,462 q26,12 52,0 q-14,6 -26,6 q-12,0 -26,-6 Z" fill="#2E2A25" opacity=".85"/>
    <line x1="660" y1="462" x2="660" y2="436" stroke="#2E2A25" stroke-width="2" opacity=".7"/>
    <path d="M660,436 q16,10 0,22 Z" fill="#2E2A25" opacity=".55"/>
    <circle cx="660" cy="452" r="2.6" fill="#2E2A25" opacity=".8"/>
  </g>

  <!-- 飞鸟 -->
  <g stroke="#2E2A25" stroke-width="2.4" fill="none" opacity=".65" stroke-linecap="round">
    <path d="M880,150 q10,-9 20,0 q10,-9 20,0"/>
    <path d="M930,120 q8,-7 16,0 q8,-7 16,0"/>
    <path d="M850,185 q7,-6 14,0 q7,-6 14,0"/>
  </g>

  <!-- 落款印章 -->
  <g transform="translate(1100,560) rotate(-2)">
    <rect x="0" y="0" width="58" height="58" rx="6" fill="#B03A2E" opacity=".92"/>
    <text x="29" y="38" text-anchor="middle" font-size="30" fill="#F2EBD8" font-family="KaiTi,serif">沱</text>
  </g>
</svg>
