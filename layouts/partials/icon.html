{{- /* 极简线性图标：partial "icon.html" "pin" */ -}}
{{- $name := . -}}
<svg class="icon icon-{{ $name }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {{- if eq $name "pin" -}}
  <path d="M12 21.5s-7-5.8-7-11a7 7 0 1 1 14 0c0 5.2-7 11-7 11z"/><circle cx="12" cy="10.2" r="2.6"/>
  {{- else if eq $name "cloud" -}}
  <path d="M6.5 18.5a4 4 0 1 1 .6-7.96A5.5 5.5 0 0 1 17.8 11.8a3.5 3.5 0 0 1-.3 6.7z"/>
  {{- else if eq $name "clock" -}}
  <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.2 2"/>
  {{- else if eq $name "calendar" -}}
  <rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10.5h16"/>
  {{- else if eq $name "mountain" -}}
  <path d="M3 19.5 9.5 8l3.8 6.5 2.4-3.8L21 19.5z"/>
  {{- else if eq $name "route" -}}
  <circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="5" r="2.2"/><path d="M8.2 19h6.9a3.4 3.4 0 0 0 0-6.8H9.5a3.4 3.4 0 0 1 0-6.8h6.3"/>
  {{- else if eq $name "search" -}}
  <circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/>
  {{- else if eq $name "sun" -}}
  <circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  {{- else if eq $name "moon" -}}
  <path d="M20 13.2A8 8 0 1 1 10.8 4 6.4 6.4 0 0 0 20 13.2z"/>
  {{- else if eq $name "arrow-left" -}}
  <path d="M19 12H5M11 6l-6 6 6 6"/>
  {{- else if eq $name "arrow-right" -}}
  <path d="M5 12h14M13 6l6 6-6 6"/>
  {{- else if eq $name "book" -}}
  <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/>
  {{- end -}}
</svg>
